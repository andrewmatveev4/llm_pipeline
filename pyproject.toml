[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm_pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["openai", "python-dotenv", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest", "flake8", "autopep8"]

[project.scripts]
llm-pipeline = "llm_pipeline.cli:main"

[tool.setuptools]
packages = ["llm_pipeline"]

